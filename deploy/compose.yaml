services:
  aiptimize:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${AIPTIMIZE_VERSION:-dev}
        COMMIT: ${AIPTIMIZE_COMMIT:-}
        BUILD_DATE: ${AIPTIMIZE_BUILD_DATE:-}
    image: aiptimize:local
    container_name: aiptimize
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: ../.env
        required: false
    environment:
      AIPTIMIZE_DATA_DIR: /data
      AIPTIMIZE_LISTEN: 0.0.0.0:8080
      AIPTIMIZE_TZ: ${AIPTIMIZE_TZ:-Europe/Stockholm}
      AIPTIMIZE_SIMULATOR: ${AIPTIMIZE_SIMULATOR:-false}
      AIPTIMIZE_ENABLE_WRITES: ${AIPTIMIZE_ENABLE_WRITES:-false}
      AIPTIMIZE_ENABLE_EV_CONTROL: ${AIPTIMIZE_ENABLE_EV_CONTROL:-false}
    volumes:
      - aiptimize-data:/data
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true

volumes:
  # Explicit name: the default "<project>_aiptimize-data" collides with a volume
  # left behind by an earlier application in this workspace.
  aiptimize-data:
    name: aiptimize-v1-data
