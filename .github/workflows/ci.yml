name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build web assets
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: gofmt
        run: |
          files="$(gofmt -l cmd internal)"
          if [ -n "$files" ]; then echo "gofmt required:"; echo "$files"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Typecheck and build
        working-directory: web
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: |
          docker build -f deploy/Dockerfile \
            --build-arg VERSION="${GITHUB_SHA::12}" \
            --build-arg COMMIT="${GITHUB_SHA::7}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t aiptimize:ci .
